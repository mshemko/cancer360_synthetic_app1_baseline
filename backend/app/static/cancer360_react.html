<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cancer 360</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: "#3b4a7c",
            page: "#f5f5f5",
            success: "#4caf50",
            panel: "#ffffff",
            ink: "#1f2937",
            muted: "#6b7280",
          },
          boxShadow: {
            panel: "0 12px 28px rgba(15, 23, 42, 0.08)",
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer base {
      body {
        @apply m-0 bg-page font-sans text-ink;
      }
      button {
        @apply font-inherit;
      }
    }

    @layer components {
      .surface {
        @apply rounded-2xl bg-white shadow-panel;
      }
      .nav-tab {
        @apply flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-medium text-white/80 transition hover:bg-white/10 hover:text-white;
      }
      .nav-tab-active {
        @apply bg-white/20 text-white shadow-inner;
      }
      .table-head {
        @apply border-b border-slate-200 bg-slate-50 px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500;
      }
      .table-cell {
        @apply border-b border-slate-100 px-4 py-3 align-top text-sm text-slate-700;
      }
    }
  </style>
  <style>
    .scrollbar-thin::-webkit-scrollbar { height: 10px; width: 10px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: #f1f5f9; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.development.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="/static/cancer360_react.jsx"></script>
</body>
</html>
